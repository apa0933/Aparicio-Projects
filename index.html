<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg-widget:#2c303b;
--white:#ffffff;
--dim:rgba(255,255,255,0.55);
--dim-strong:rgba(255,255,255,0.85);
--divider:rgba(255,255,255,0.08);
--rain:#6fc3ff;
--cols:54px 26px 1fr 34px 34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
margin:0;
min-height:100%;
background:transparent;
display:flex;
align-items:center;
justify-content:center;
padding:0;
font-family:'Fredoka',"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
color:var(--white);
}
.wrap{width:440px;max-width:100%;}
.toolbar{
display:flex;
gap:8px;
margin-bottom:12px;
max-height:44px;
opacity:1;
overflow:hidden;
transition:max-height .25s ease,opacity .2s ease,margin-bottom .25s ease;
}
.toolbar.hidden{max-height:0;opacity:0;margin-bottom:0;pointer-events:none;}
.city-input{
flex:1;
min-width:0;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.14);
border-radius:10px;
padding:8px 12px;
color:var(--white);
font-family:inherit;
font-size:13px;
outline:none;
}
.city-input::placeholder{color:rgba(255,255,255,0.35);}
.go-btn{
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.16);
color:var(--white);
border-radius:10px;
padding:8px 14px;
font-family:inherit;
font-size:13px;
font-weight:600;
cursor:pointer;
}
.go-btn:active{background:rgba(255,255,255,0.2);}
.widget{
background:var(--bg-widget);
border-radius:24px;
padding:25px 25px 14px;
display:flex;
flex-direction:column;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
}
.widget-row{display:flex;gap:22px;align-items:stretch;}
.left{
flex:0 0 auto;
width:150px;
display:flex;
flex-direction:column;
justify-content:space-between;
gap:12px;
}
.city-row{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
.city-name{
font-size:16px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.big-temp{
font-size:64px;
font-weight:300;
line-height:1;
margin:6px 0 8px;
letter-spacing:-1.5px;
}
.desc-text{
font-size:14px;
font-weight:500;
color:var(--dim-strong);
line-height:1.3;
}
.meta{display:flex;flex-direction:column;gap:3px;}
.meta-item{
display:flex;
justify-content:space-between;
font-size:12px;
color:var(--dim);
}
.meta-item b{font-weight:600;color:var(--white);font-variant-numeric:tabular-nums;}
.right{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
border-left:1px solid var(--divider);
padding-left:20px;
}
.day-head,.day-row{
display:grid;
grid-template-columns:var(--cols);
align-items:center;
column-gap:6px;
}
.day-head{
padding:0 0 4px;
margin-bottom:2px;
border-bottom:1px solid var(--divider);
font-size:10.5px;
font-weight:500;
color:var(--dim);
min-height:19px;
}
.day-head span:nth-child(3){text-align:left;}
.day-head span:nth-child(4),.day-head span:nth-child(5){text-align:right;}
.day-row{padding:5px 0;}
.day-row.today .day-name{color:var(--rain);}
.day-name{font-size:13px;font-weight:600;white-space:nowrap;}
.day-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.day-icon svg{width:100%;height:100%;}
.day-pop{
font-size:11.5px;
font-weight:600;
color:var(--rain);
text-align:left;
font-variant-numeric:tabular-nums;
}
.day-pop.low{opacity:0.5;font-weight:500;}
.temp-min{font-size:13px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;}
.temp-max{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
.status{text-align:center;font-size:12.5px;color:var(--dim);padding:10px 0 0;}
.status.error{color:#ff9a9a;}
.status:empty{display:none;}
.footer-brand{
text-align:center;
font-size:10px;
font-weight:500;
letter-spacing:0.3px;
color:rgba(255,255,255,0.22);
margin-top:6px;
user-select:none;
}
.skel{
display:inline-block;
background:linear-gradient(100deg,rgba(255,255,255,0.06) 8%,rgba(255,255,255,0.16) 22%,rgba(255,255,255,0.06) 36%);
background-size:250% 100%;
animation:shimmer 1.5s ease-in-out infinite;
border-radius:8px;
vertical-align:middle;
}
@keyframes shimmer{0%{background-position:180% 0;}100%{background-position:-80% 0;}}
.skel-city{width:72px;height:14px;border-radius:6px;}
.skel-temp{width:112px;height:58px;border-radius:14px;}
.skel-line{display:block;width:100%;height:9px;border-radius:5px;margin-bottom:7px;}
.skel-line.short{width:65%;}
.skel-day-name{width:30px;height:11px;border-radius:5px;}
.skel-icon{width:24px;height:24px;border-radius:50%;}
.skel-pop{width:24px;height:10px;border-radius:5px;}
.skel-minmax{width:24px;height:10px;border-radius:5px;margin-left:auto;}

html[data-mov]{--cols:46px 24px 1fr 36px 36px;}
html[data-mov] body{padding:8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));}
html[data-mov] .wrap{width:100%;}
html[data-mov] .widget{padding:14px 16px 8px;border-radius:20px;}
html[data-mov] .widget-row{flex-direction:column;gap:8px;}
html[data-mov] .left{width:100%;flex-direction:row;align-items:flex-end;justify-content:space-between;gap:12px;}
html[data-mov] .left>div:first-child{min-width:0;flex:1;}
html[data-mov] .big-temp{margin:2px 0 3px;line-height:.95;}
html[data-mov] .desc-text{line-height:1.2;}
html[data-mov] .meta{flex:0 0 auto;min-width:112px;gap:2px;}
html[data-mov] .meta-item{gap:14px;font-size:12px;}
html[data-mov] .right{border-left:none;border-top:1px solid var(--divider);padding:6px 0 0;width:100%;}
html[data-mov] .day-head{padding-bottom:2px;margin-bottom:0;min-height:16px;}
html[data-mov] .day-row{padding:2px 0;}
html[data-mov] .day-icon{width:22px;height:22px;}
html[data-mov] .footer-brand{margin-top:2px;font-size:9.5px;}
html[data-mov] .status{padding-top:6px;}
html[data-mov] .city-input{font-size:16px;padding:10px 12px;}
html[data-mov] .go-btn{min-height:42px;}
html[data-mov] .toolbar{max-height:52px;}
html[data-mov] .toolbar.hidden{max-height:0;}
html[data-tam="md"]{--cols:54px 26px 1fr 40px 40px;}
html[data-tam="md"] .big-temp{font-size:54px;}
html[data-tam="sm"] .big-temp{font-size:50px;}
html[data-tam="sm"] .city-name{font-size:15px;}
html[data-tam="xs"]{--cols:40px 22px 1fr 32px 32px;}
html[data-tam="xs"] body{padding:6px;}
html[data-tam="xs"] .widget{padding:12px 12px 6px;border-radius:16px;}
html[data-tam="xs"] .big-temp{font-size:42px;}
html[data-tam="xs"] .city-name{font-size:14px;}
html[data-tam="xs"] .desc-text{font-size:12.5px;}
html[data-tam="xs"] .meta{min-width:100px;}
html[data-tam="xs"] .meta-item{font-size:11.5px;gap:8px;}
html[data-tam="xs"] .day-name,html[data-tam="xs"] .temp-min,html[data-tam="xs"] .temp-max{font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
<div class="toolbar hidden" id="toolbar">
<input type="text" id="cityinput" class="city-input" placeholder="Ingresá tu ciudad, país (ej: Montevideo,UY)">
<button class="go-btn" id="gobtn">Buscar</button>
</div>
<div class="widget">
<div class="widget-row">
<div class="left">
<div>
<div class="city-row" id="cityrow" title="Tocá para buscar otra ciudad">
<span class="city-name" id="cityname">—</span>
</div>
<div class="big-temp" id="bigtemp">—</div>
<div class="desc-text" id="desctext"></div>
</div>
<div class="meta" id="meta"></div>
</div>
<div class="right" id="forecastright"></div>
</div>
<div class="footer-brand" id="footer">Aparicio Weather</div>
</div>
<div class="status" id="status"></div>
</div>
<script>
const api_key = "207c1ef5132b69b9aa87857887184d6b";
const storage_key = 'aparicio_clima_ciudad';
const root = document.documentElement;
const cityinput = document.getElementById('cityinput');
const gobtn = document.getElementById('gobtn');
const toolbar = document.getElementById('toolbar');
const cityrow = document.getElementById('cityrow');
const citynameel = document.getElementById('cityname');
const bigtempel = document.getElementById('bigtemp');
const desctextel = document.getElementById('desctext');
const metael = document.getElementById('meta');
const forecastright = document.getElementById('forecastright');
const statusel = document.getElementById('status');
const footerel = document.getElementById('footer');
const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let locationset = false;
let lastquery = null;
let lastfetch = 0;

function ajustar(){
const w = Math.min(innerWidth,root.clientWidth || innerWidth);
const tam = w <= 349 ? 'xs' : w <= 429 ? 'sm' : w <= 520 ? 'md' : 'lg';
root.dataset.tam = tam;
if(tam === 'lg') delete root.dataset.mov;
else root.dataset.mov = '';
}
ajustar();
addEventListener('resize',ajustar);
addEventListener('orientationchange',ajustar);

function weathericon(code,size){
const main = code.slice(0,2);
const isnight = code.endsWith('n');
const s = size || 24;
const bg = '#2c303b';
const rays = [0,45,90,135,180,225,270,315].map(a => `<line x1="12" y1="2.6" x2="12" y2="4.8" transform="rotate(${a} 12 12)" stroke="#ffcc4d" stroke-width="1.8" stroke-linecap="round"/>`).join('');
const sun = `<circle cx="12" cy="12" r="5.2" fill="#ffcc4d"/>${rays}`;
const moonpath = `M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z`;
const moon = `<path d="${moonpath}" fill="#e6e9f0"/>`;
const cloudpath = `M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z`;
const cloud = (t,stroke) => `<path d="${cloudpath}" transform="${t}" fill="#ffffff"${stroke ? ` stroke="${bg}" stroke-width="2"` : ''}/>`;
const cloudbig = cloud('translate(2.4 3.6) scale(0.8)',false);
const cloudtop = cloud('translate(3.6 1.2) scale(0.72)',false);
const partly = isnight
? `<g transform="translate(-2.3 -1.5) scale(1.12)"><path d="${moonpath}" transform="translate(2 2) scale(0.5)" fill="#e6e9f0"/>${cloud('translate(8.2 8.4) scale(0.6)',true)}</g>`
: `<g transform="translate(-2.3 -1.5) scale(1.12)"><circle cx="8" cy="8" r="3.8" fill="#ffcc4d"/>${cloud('translate(8.2 8.4) scale(0.6)',true)}</g>`;
const rainlines = `<line x1="8.5" y1="17.5" x2="7.5" y2="21" stroke="#6fc3ff" stroke-width="1.7" stroke-linecap="round"/><line x1="12.5" y1="17.5" x2="11.5" y2="21" stroke="#6fc3ff" stroke-width="1.7" stroke-linecap="round"/><line x1="16.5" y1="17.5" x2="15.5" y2="21" stroke="#6fc3ff" stroke-width="1.7" stroke-linecap="round"/>`;
const snowflakes = `<circle cx="8" cy="19" r="1.3" fill="#ffffff"/><circle cx="12" cy="20.5" r="1.3" fill="#ffffff"/><circle cx="16" cy="19" r="1.3" fill="#ffffff"/>`;
const bolt = `<path d="M13.2 15.6h-2.6l1.6-4.4-4.6 6h2.6l-1.4 4.2z" fill="#ffd166" transform="translate(1.2 0.4)"/>`;
const fog = `<line x1="3" y1="6.5" x2="21" y2="6.5" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/><line x1="5" y1="10.8" x2="19" y2="10.8" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="15.1" x2="21" y2="15.1" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/><line x1="6" y1="19.4" x2="18" y2="19.4" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/>`;
let inner = '';
switch(main){
case '01': inner = isnight ? moon : sun; break;
case '02': inner = partly; break;
case '03':
case '04': inner = cloudbig; break;
case '09':
case '10': inner = cloudtop + rainlines; break;
case '11': inner = cloudtop + bolt; break;
case '13': inner = cloudtop + snowflakes; break;
case '50': inner = fog; break;
default: inner = cloudbig;
}
return `<svg viewBox="0 0 24 24" width="${s}" height="${s}">${inner}</svg>`;
}

function setstatus(msg,iserror=false){
statusel.textContent = msg;
statusel.className = 'status' + (iserror ? ' error' : '');
}

function headhtml(showrain){
return `<div class="day-head"><span>Día</span><span></span><span>${showrain ? 'Lluvia' : ''}</span><span>Mín</span><span>Máx</span></div>`;
}

function showskeleton(){
citynameel.innerHTML = '<span class="skel skel-city"></span>';
bigtempel.innerHTML = '<span class="skel skel-temp"></span>';
desctextel.innerHTML = '<span class="skel skel-line"></span><span class="skel skel-line short"></span>';
metael.innerHTML = '';
forecastright.innerHTML = headhtml(true) + Array.from({length:5}).map(() => `
<div class="day-row">
<div class="skel skel-day-name"></div>
<div class="skel skel-icon"></div>
<div class="skel skel-pop"></div>
<div class="skel skel-minmax"></div>
<div class="skel skel-minmax"></div>
</div>
`).join('');
}

async function fetchbycity(city){
lastquery = city;
if(!locationset) showskeleton();
setstatus('');
try{
const [currentres,forecastres] = await Promise.all([
fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${api_key}&units=metric&lang=es`),
fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${api_key}&units=metric&lang=es`)
]);
if(!currentres.ok || !forecastres.ok) throw new Error('No se encontró la ciudad o falló la API');
render(await currentres.json(),await forecastres.json());
lastfetch = Date.now();
setstatus('');
}catch(err){
setstatus(err.message,true);
if(!locationset) showtoolbar();
}
}

function weatherseverity(main){
const rank = {Thunderstorm:6,Snow:5,Rain:4,Drizzle:3,Clouds:2};
return rank[main] ?? 1;
}

function builddaily(current,forecast){
const tz = forecast.city && typeof forecast.city.timezone === 'number' ? forecast.city.timezone : (current.timezone || 0);
const localdate = ts => new Date((ts + tz) * 1000).toISOString().slice(0,10);
const localhour = ts => new Date((ts + tz) * 1000).getUTCHours();
const nowts = Math.floor(Date.now() / 1000);
const todaystr = localdate(nowts);
const groups = {};
const newgroup = () => ({blocks:[],min:Infinity,max:-Infinity,pop:0});
forecast.list.forEach(item => {
const date = localdate(item.dt);
if(!groups[date]) groups[date] = newgroup();
const g = groups[date];
g.blocks.push({hour:localhour(item.dt),item});
g.min = Math.min(g.min,item.main.temp_min);
g.max = Math.max(g.max,item.main.temp_max);
g.pop = Math.max(g.pop,item.pop || 0);
});
if(!groups[todaystr]) groups[todaystr] = newgroup();
const t = groups[todaystr];
t.min = Math.min(t.min,current.main.temp);
t.max = Math.max(t.max,current.main.temp);
return Object.keys(groups).filter(d => d >= todaystr).sort().slice(0,5).map(datestr => {
const g = groups[datestr];
const istoday = datestr === todaystr;
let icon;
let desc;
if(istoday){
icon = current.weather[0].icon;
desc = current.weather[0].description;
}else{
const rep = g.blocks.reduce((best,b) => {
const bs = weatherseverity(b.item.weather[0].main);
const bests = weatherseverity(best.item.weather[0].main);
if(bs !== bests) return bs > bests ? b : best;
return Math.abs(b.hour - 12) < Math.abs(best.hour - 12) ? b : best;
}).item;
icon = rep.weather[0].icon.replace('n','d');
desc = rep.weather[0].description;
}
return {
datestr,
istoday,
icon,
desc,
min:Math.round(g.min),
max:Math.round(g.max),
pop:Math.round(g.pop * 100)
};
});
}

function render(current,forecast){
const days = builddaily(current,forecast);
const anyrain = days.some(d => d.pop > 0);
citynameel.textContent = current.name;
bigtempel.textContent = `${Math.round(current.main.temp)}°`;
desctextel.textContent = cap(current.weather[0].description);
const viento = Math.round((current.wind ? current.wind.speed : 0) * 3.6);
metael.innerHTML = `
<div class="meta-item"><span>Sensación</span><b>${Math.round(current.main.feels_like)}°</b></div>
<div class="meta-item"><span>Humedad</span><b>${current.main.humidity}%</b></div>
<div class="meta-item"><span>Viento</span><b>${viento} km/h</b></div>
`;
forecastright.innerHTML = headhtml(anyrain) + days.map((d,i) => {
const label = i === 0 ? 'Hoy' : dias[new Date(d.datestr + 'T00:00:00Z').getUTCDay()];
const pophtml = d.pop > 0 ? `<div class="day-pop${d.pop < 20 ? ' low' : ''}">${d.pop}%</div>` : `<div class="day-pop"></div>`;
return `
<div class="day-row${d.istoday ? ' today' : ''}">
<div class="day-name">${label}</div>
<div class="day-icon">${weathericon(d.icon,26)}</div>
${pophtml}
<div class="temp-min">${d.min}°</div>
<div class="temp-max">${d.max}°</div>
</div>
`;
}).join('');
const hora = new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
footerel.textContent = `Aparicio Weather · actualizado ${hora}`;
locationset = true;
hidetoolbar();
try{
if(canpersist) localStorage.setItem(storage_key,lastquery);
}catch(e){}
}

function cap(s){return s.charAt(0).toUpperCase() + s.slice(1);}

function storageavailable(){
try{
const testkey = '__aparicio_test__';
localStorage.setItem(testkey,'1');
localStorage.removeItem(testkey);
return true;
}catch(e){
return false;
}
}
const canpersist = storageavailable();

function showtoolbar(){
toolbar.classList.remove('hidden');
cityinput.focus();
cityinput.select();
}
function hidetoolbar(){
toolbar.classList.add('hidden');
}

gobtn.addEventListener('click',() => {
const city = cityinput.value.trim();
if(city) fetchbycity(city);
});
cityinput.addEventListener('keydown',e => {if(e.key === 'Enter') gobtn.click();});
cityrow.addEventListener('click',() => {
if(!locationset) return;
if(toolbar.classList.contains('hidden')) showtoolbar();
else hidetoolbar();
});

let savedcity = null;
if(canpersist){
try{
savedcity = localStorage.getItem(storage_key);
}catch(e){}
}

if(savedcity){
cityinput.value = savedcity;
fetchbycity(savedcity);
}else{
setTimeout(() => {
setstatus(canpersist ? 'Ingresá una ciudad para comenzar' : 'Ingresá una ciudad (este entorno no permite guardarla)');
showtoolbar();
},1000);
}

setInterval(() => {
if(lastquery) fetchbycity(lastquery);
},30 * 60 * 1000);

document.addEventListener('visibilitychange',() => {
if(document.visibilityState === 'visible' && lastquery && Date.now() - lastfetch > 10 * 60 * 1000) fetchbycity(lastquery);
});
</script>
</body>
</html>
